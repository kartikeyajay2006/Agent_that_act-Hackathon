[project]
name = "forgesre"
version = "0.1.0"
description = "ForgeSRE MCP server: narrow, validated SRE tools for the TrueForge agent harness"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.28",
    "docker>=7.1",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "uvicorn>=0.32",
    "starlette>=0.40",
    "trueforge-sdk>=0.2.0",
]

[project.scripts]
forgesre-mcp = "forgesre.server:main"
forgesre = "forgesre.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgesre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs the running docker demo stack"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["gateway:8080"]
        labels: { component: api-gateway }

  - job_name: payment-service
    static_configs:
      - targets: ["payment-v1:8000"]
        labels: { component: payment-service, instance_version: v1 }
      - targets: ["payment-v2:8000"]
        labels: { component: payment-service, instance_version: v2 }
      - targets: ["payment-v3:8000"]
        labels: { component: payment-service, instance_version: v3 }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { component: postgres }
